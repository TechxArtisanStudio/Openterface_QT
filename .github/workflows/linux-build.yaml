name: Build / Linux Build

# This workflow depends on pre-built Docker images from build-qt-environments.yml
# Ensure that workflow has been run successfully before running this build

on:
  push:
    branches: ["main", "dev_260624_MCPserver"]
    tags: ["v*"]
    paths:
      - '.github/workflows/linux-build.yaml'
      - 'vcpkg.json'
      - 'CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.bat'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.ui'
      - '**/*.ts'
      - '**/*.qrc'
      - 'packaging/archlinux/**'
  pull_request:
    branches: ["main", "dev"]
    paths:
      - '.github/workflows/linux-build.yaml'
      - 'vcpkg.json'
      - 'CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.bat'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.ui'
      - '**/*.ts'
      - '**/*.qrc'
      - 'packaging/archlinux/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of Qt build to use'
        required: true
        default: 'both'
        type: choice
        options:
        - 'shared'
        - 'static'
        - 'both'
      ubuntu_version:
        description: 'Ubuntu base image version'
        required: false
        default: '22.04'
        type: choice
        options:
        - '22.04'
        - '24.04'

env:
  ARTIFACT: openterfaceQT
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.6.3
  REGISTRY: ghcr.io

jobs:
  build-shared:
    if: ${{ github.event.inputs.build_type == 'shared' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Shared or Static build in env
        run: |
          if [ "${{ github.event.inputs.environment_type || 'static' }}" = "shared" ]; then
            echo "SHARED_OR_STATIC=shared" >> $GITHUB_ENV
          else
            echo "SHARED_OR_STATIC=static" >> $GITHUB_ENV
          fi

      - name: Set lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
          SHARED: ${{ env.SHARED_OR_STATIC }}
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=${OWNER}/${SHARED}-qtbuild" >> $GITHUB_ENV
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built shared Qt Docker Image
        run: |
          echo "Pulling pre-built shared Qt Docker image for amd64..."

          IMAGE_TAG="ubuntu-${{ github.event.inputs.ubuntu_version || '22.04' }}-amd64"
          IMG="ghcr.io/techxartisanstudio/shared-qtbuild-complete"
          echo "Checking for image: ${IMG}:$IMAGE_TAG"

          # Check if image exists in registry
          if docker manifest inspect ${IMG}:$IMAGE_TAG > /dev/null 2>&1; then
            echo "Pre-built image found, pulling..."
            docker pull ${IMG}:$IMAGE_TAG

            echo "Successfully pulled pre-built shared Qt Docker image for amd64"
          else
            echo "Error: Pre-built shared Qt Docker image not found in registry for amd64"
            echo "Looking for: ${IMG}:$IMAGE_TAG"
            echo "Please run the 'Build Qt Environments' workflow first to build the required Docker images"
            echo "Workflow URL: https://github.com/${{ github.repository }}/actions/workflows/build-qt-environments.yml"
            exit 1
          fi

          # Tag the architecture-specific image as latest for local use
          docker tag ${IMG}:$IMAGE_TAG ${IMG}:latest

          # Also tag to the original expected name if later steps reference it
          docker tag ${IMG}:$IMAGE_TAG ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-complete:latest || true

          # Verify the image was pulled successfully
          docker images | grep qtbuild-complete || {
            echo "Error: Failed to verify shared Qt Docker image"
            exit 1
          }

      - name: Get all tags for correct version determination
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --all --tags -f

      - name: Read version from version.h
        id: read_version
        run: |
          VERSION=$(grep -oP '#define APP_VERSION "\K[^"]+' resources/version.h)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update and compile translations
        run: |
          docker run --rm \
            -e LANG=C.UTF-8 \
            -v ${{ github.workspace }}:/workspace/src \
            -v ${{ github.workspace }}/build-script/docker-translation.sh:/translation-script.sh:ro \
            -w /workspace/src \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-complete:latest \
            bash /translation-script.sh

      - name: Build, package via docker-build-shared.sh (amd64)
        run: |
          mkdir -p ${{ runner.temp }}/build-shared
          docker run --rm \
          	--env OPENTERFACE_BUILD_STATIC=OFF \
          	-e LANG=C.UTF-8 \
            -v ${{ github.workspace }}:/workspace/src \
            -v ${{ runner.temp }}/build-shared:/workspace/build \
            -w /workspace/src \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-complete:latest \
            bash /workspace/src/build-script/docker-build-shared.sh
          echo "BUILD_DIR=${{ runner.temp }}/build-shared" >> $GITHUB_ENV

      - name: Upload shared .deb
        uses: actions/upload-artifact@v4
        with:
          name: openterfaceQT_linux_amd64.deb
          path: ${{ runner.temp }}/build-shared/openterfaceQT_*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload shared .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: openterfaceQT_linux_amd64.AppImage
          path: ${{ runner.temp }}/build-shared/openterfaceQT_*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload shared .rpm
        uses: actions/upload-artifact@v4
        with:
          name: openterfaceQT_linux_amd64.rpm
          path: ${{ runner.temp }}/build-shared/openterfaceQT_*.rpm
          if-no-files-found: error
          retention-days: 30

  build-arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      LANG: C.UTF-8
    steps:
      - name: Update system and install build tools
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            sudo

      - name: Create non-root builder (makepkg refuses root)
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '#define APP_VERSION' resources/version.h | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building openterfaceqt version: ${VERSION}"

      - name: Install package dependencies
        run: |
          pacman -S --noconfirm --needed \
            qt6-base \
            qt6-declarative \
            qt6-multimedia \
            qt6-svg \
            qt6-serialport \
            qt6-wayland \
            qt6-tools \
            extra-cmake-modules \
            ffmpeg \
            gstreamer \
            gst-plugins-base \
            gst-plugins-good \
            libpulse \
            libxkbcommon \
            libusb \
            v4l-utils \
            libjpeg-turbo \
            zlib \
            libglvnd \
            wayland \
            libxcb \
            libx11

      - name: Prepare build directory
        run: |
          BUILD_DIR=/home/builder/archpkg
          SRC_DIR="${BUILD_DIR}/openterfaceqt-${{ steps.version.outputs.version }}"

          sudo -u builder mkdir -p "${BUILD_DIR}"

          # Create source tarball from the current checkout
          # (--transform strips leading ./ and prefixes with pkgname-pkgver)
          tar czf "${BUILD_DIR}/openterfaceqt-${{ steps.version.outputs.version }}.tar.gz" \
            --transform "s,^\.,openterfaceqt-${{ steps.version.outputs.version }}," \
            --exclude='.git' \
            --exclude='./build' \
            --exclude='*.pkg.tar.*' \
            --exclude='pkgroot' \
            --exclude='rpmbuild*' \
            .

          # Copy packaging files
          cp packaging/archlinux/PKGBUILD "${BUILD_DIR}/"
          cp packaging/archlinux/openterfaceqt-udev.rules "${BUILD_DIR}/"
          cp packaging/archlinux/openterfaceqt.install "${BUILD_DIR}/"

          # Update pkgver in PKGBUILD to match current source
          sudo sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" "${BUILD_DIR}/PKGBUILD"

          # Give builder ownership
          chown -R builder:builder "${BUILD_DIR}"

      - name: Build package with makepkg
        run: |
          cd /home/builder/archpkg
          sudo -u builder makepkg -s --noconfirm --skipchecksums

      - name: Validate package with namcap
        if: always()
        run: |
          pacman -S --noconfirm namcap
          cd /home/builder/archpkg
          # namcap is advisory — don't fail the build on warnings
          sudo -u builder namcap PKGBUILD || true
          for pkg in *.pkg.tar.zst; do
            sudo -u builder namcap "$pkg" || true
          done

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: openterfaceQT_linux_amd64.pkg.tar.zst
          path: /home/builder/archpkg/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [build-shared, build-arch]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Linux Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.build-shared.result }}" = "success" ]; then
            echo "✅ Shared build (.deb, .AppImage, .rpm): success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Shared build (.deb, .AppImage, .rpm): ${{ needs.build-shared.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ needs.build-arch.result }}" = "success" ]; then
            echo "✅ Arch Linux package: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Arch Linux package: ${{ needs.build-arch.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi
